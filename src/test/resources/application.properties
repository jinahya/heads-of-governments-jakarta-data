#
# Test configuration for heads-of-governments-jakarta-data: heads_of_governments.sqlite3, a test resource copied from
# heads-of-governments-persistence's db/, opened read-only. No persistence.xml; the entities are indexed.
#

# SQLite has no Quarkus JDBC extension of its own; `other`, with the driver named.
# open_mode=1 opens the database read-only; jdbc.explicit_readonly lets the pool call
# Connection#setReadOnly, which the driver refuses otherwise once the connection is open.
quarkus.datasource.db-kind=other
quarkus.datasource.jdbc.driver=org.sqlite.JDBC
quarkus.datasource.jdbc.url=jdbc:sqlite::resource:heads_of_governments.sqlite3?open_mode=1&jdbc.explicit_readonly=true

# Hibernate's SQLiteDialect, from hibernate-community-dialects. The database is the fixture; nothing here may touch
# its schema.
quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect
quarkus.hibernate-orm.schema-management.strategy=none

# The entities are in the upstream jar, which Quarkus indexes only when told to. That jar also carries a
# persistence.xml, for its own tests; this unit is configured here instead.
quarkus.index-dependency.heads-of-governments-persistence.group-id=io.github.jinahya
quarkus.index-dependency.heads-of-governments-persistence.artifact-id=heads-of-governments-persistence
quarkus.hibernate-orm.persistence-xml.ignore=true
